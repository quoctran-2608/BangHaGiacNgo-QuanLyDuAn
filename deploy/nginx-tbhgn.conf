# Mẫu cấu hình Nginx cho TBHGN tại domain giacngo.nhamycali.com
# Lưu tại: /etc/nginx/sites-available/tbhgn
# Kích hoạt: sudo ln -s /etc/nginx/sites-available/tbhgn /etc/nginx/sites-enabled/tbhgn

server {
    listen 80;
    listen [::]:80;
    server_name giacngo.nhamycali.com;

    # Giữ đường dẫn xác thực SSL Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type "text/plain";
        root /var/www/html;
    }

    # Chặn truy cập trực tiếp thư mục dữ liệu nội bộ, cấu hình và mã nguồn máy chủ
    location ~* ^/(server/|server_data|dist-server|deploy|docs/|\.env|firestore\.rules|firebase-blueprint\.json|firebase-applet-config\.json|security_spec\.md|server\.ts|package\.json|tsconfig) {
        return 403;
    }

    # OAuth 2.1 Discovery Metadata (RFC 9728 / RFC 8414) cho MCP Server V1.0
    location ^~ /.well-known/oauth- {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # TBHGN MCP Server V1.0 (Streamable HTTP, chỉ đọc)
    location = /mcp {
        proxy_pass http://127.0.0.1:3000/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Tắt buffering để Streamable HTTP / SSE phản hồi mượt, tránh cắt sớm
        proxy_buffering off;
        proxy_cache off;
        client_max_body_size 128k;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;

        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Sau khi chạy certbot --nginx, Certbot sẽ tự động thêm khối listen 443 ssl
    # và chuyển hướng HTTP -> HTTPS tại đây.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Cho phép Firebase Google Sign-In Popup hoạt động ổn định trên desktop & mobile
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
